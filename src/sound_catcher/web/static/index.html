<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HOMERUN² SOUND CATCHER</title>
<script>
  // In homerun2-portal's iframe the portal shows the brand and the service
  // name: hr-embedded switches to the compact header. Set before the first
  // paint, so the big banner never flashes.
  if (window.self !== window.top) document.documentElement.classList.add('hr-embedded');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* The homerun2 design tokens: a copy of homerun2-portal's
     static/homerun2-tokens.css for running without the portal. Behind it the
     page also links the portal's file (after this block), and its :root wins
     over this zero-specificity copy. */
  :where(:root) {
    --hr-bg: #0b1120;
    --hr-surface: #111827;
    --hr-card: #1e293b;
    --hr-border: #334155;
    --hr-text: #e2e8f0;
    --hr-muted: #94a3b8;
    --hr-accent: #6366f1;
    --hr-accent-2: #a855f7;
    --hr-accent-3: #f97316;
    --hr-ok: #22c55e;
    --hr-info: #38bdf8;
    --hr-warning: #eab308;
    --hr-error: #ef4444;
  }

  /* The homerun2 look (core-catcher, led-catcher): navy, an indigo-to-purple
     header with an orange rule, pixel type for the name. */
  :root {
    color-scheme: dark;
    --bg-primary: var(--hr-bg);
    --bg-secondary: var(--hr-card);
    --bg-tertiary: var(--hr-border);
    --text-primary: var(--hr-text);
    --text-secondary: var(--hr-muted);
    --text-muted: #64748b;
    --accent-indigo: var(--hr-accent);
    --accent-purple: var(--hr-accent-2);
    --accent-orange: var(--hr-accent-3);
    --accent-amber: #fbbf24;
    --accent-link: color-mix(in srgb, var(--hr-accent), white 25%);
    --severity-error: var(--hr-error);
    --severity-warning: var(--hr-warning);
    --severity-success: var(--hr-ok);
    --severity-info: var(--hr-info);
    --severity-debug: #64748b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    background: var(--bg-primary);
    color: var(--text-primary);
    font-size: 13px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Header */
  .header-bar {
    background: linear-gradient(135deg, var(--accent-indigo) 0%, var(--accent-purple) 100%);
    padding: 1.8rem 1.5rem;
    border-bottom: 3px solid var(--accent-orange);
    display: flex;
    flex-wrap: wrap;
    gap: 1rem;
    justify-content: space-between;
    align-items: flex-end;
  }
  .header-bar h1 {
    font-family: 'Press Start 2P', cursive;
    font-size: 2.2rem;
    font-weight: normal;
    color: #fff;
    letter-spacing: 0.08em;
    text-shadow: 3px 3px 0 rgba(0,0,0,0.3);
  }
  .header-bar .subtitle {
    font-family: 'Press Start 2P', cursive;
    font-size: 0.7rem;
    color: var(--accent-amber);
    margin-top: 0.6rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; }
  .badge {
    background: rgba(255,255,255,0.15);
    color: #f8fafc;
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 0.75rem;
  }
  .badge.off { color: rgba(248,250,252,0.55); }
  .badge.warn { background: color-mix(in srgb, var(--accent-orange) 35%, transparent); }

  /* The compact header inside homerun2-portal (README there, "Embedded
     header"): one line on the portal's surface, no brand, the subtitle on the
     left and the badges on the right. */
  .hr-embedded .header-bar {
    font-family: var(--hr-font, system-ui, sans-serif);
    background: var(--hr-surface);
    border-bottom: 1px solid var(--hr-border);
    min-height: 44px;
    padding: 6px 16px;
    align-items: center;
  }
  .hr-embedded .header-bar h1,
  .hr-embedded .header-service { display: none; }
  .hr-embedded .header-bar .subtitle {
    font-family: inherit;
    font-size: 13px;
    color: var(--hr-muted);
    margin: 0;
    letter-spacing: normal;
    text-transform: none;
  }
  .hr-embedded .badge {
    background: transparent;
    border: 1px solid var(--hr-border);
    padding: 3px 8px;
    font-size: 12px;
    color: var(--hr-text);
  }
  .hr-embedded .badge.off { color: var(--hr-muted); }
  .hr-embedded .badge.warn { border-color: var(--hr-warning); color: var(--hr-warning); }

  main { flex: 1; padding: 1rem 1.5rem; }

  /* Controls */
  .controls { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; margin-bottom: 1rem; }
  .controls .spacer { flex: 1; }
  button {
    font: inherit;
    font-size: 0.8rem;
    background: var(--bg-secondary);
    color: var(--text-primary);
    border: 1px solid var(--bg-tertiary);
    border-radius: 6px;
    padding: 0.45rem 0.8rem;
    cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--accent-indigo); background: color-mix(in srgb, var(--accent-indigo) 15%, transparent); }
  button:disabled { opacity: 0.4; cursor: default; }
  button.primary { background: var(--accent-indigo); border-color: var(--accent-indigo); color: #fff; }
  button.primary:hover { background: var(--accent-purple); }
  label { display: inline-flex; align-items: center; gap: 0.5rem; color: var(--text-secondary); font-size: 0.8rem; }
  input[type=checkbox] { accent-color: var(--accent-indigo); }
  input[type=password] {
    font: inherit;
    background: var(--bg-primary);
    color: var(--text-primary);
    border: 1px solid var(--bg-tertiary);
    border-radius: 6px;
    padding: 0.45rem 0.6rem;
    min-width: 0;
    flex: 1 1 180px;
    max-width: 280px;
  }
  .notice { color: var(--severity-warning); margin-bottom: 0.75rem; }
  details {
    background: var(--bg-secondary);
    border: 1px solid var(--bg-tertiary);
    border-radius: 0.5rem;
    padding: 0.75rem 1rem;
    margin-bottom: 1rem;
  }
  summary { cursor: pointer; color: var(--accent-link); text-transform: uppercase; font-weight: bold; font-size: 0.75rem; }
  details .row { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center; margin-top: 0.75rem; }
  #mute-state { color: var(--text-secondary); }

  /* The announcements, as core-catcher's message table */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  thead th {
    background: var(--bg-secondary);
    color: var(--accent-link);
    text-transform: uppercase;
    text-align: left;
    font-weight: bold;
    padding: 0.75rem 1rem;
    white-space: nowrap;
  }
  tbody td { padding: 0.75rem 1rem; border-bottom: 1px solid var(--bg-secondary); vertical-align: top; }
  tbody tr:hover { background: color-mix(in srgb, var(--accent-indigo) 8%, transparent); }
  tbody tr.playing { background: color-mix(in srgb, var(--accent-indigo) 20%, transparent); }
  tbody tr.quiet td.title-cell, tbody tr.quiet td.status { color: var(--text-secondary); }
  td.time { white-space: nowrap; color: var(--text-secondary); }
  td.sev { font-weight: bold; text-transform: uppercase; color: var(--sev); white-space: nowrap; }
  td.system { color: var(--text-primary); }
  .title { overflow-wrap: anywhere; }
  .spoken { color: var(--text-secondary); font-style: italic; margin-top: 0.25rem; overflow-wrap: anywhere; }
  td.status { white-space: nowrap; color: var(--text-secondary); font-size: 0.8rem; }
  td.actions { white-space: nowrap; text-align: right; }
  td.actions button { padding: 0.3rem 0.6rem; margin-left: 0.25rem; }
  .empty { color: var(--text-muted); text-align: center; padding: 3rem 0; }
  .cap { color: var(--text-muted); font-size: 0.75rem; margin-top: 0.75rem; }

  /* Footer, as core-catcher's */
  .build-footer {
    background: var(--bg-secondary);
    color: #475569;
    padding: 0.6rem 1.5rem;
    margin-top: 1rem;
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem;
    align-items: center;
    font-size: 0.75rem;
    border-top: 1px solid var(--bg-tertiary);
  }
  .build-footer .label { color: var(--text-muted); }
  .build-footer .value { color: var(--accent-link); }
  .build-footer .brand { margin-left: auto; display: flex; align-items: center; gap: 0.5rem; }
  .build-footer a { color: var(--accent-link); text-decoration: none; }
  .build-footer img { height: 24px; }

  /* Phones: one card per announcement instead of a wide row */
  @media (max-width: 720px) {
    .header-bar { padding: 1.2rem 1rem; }
    .header-bar h1 { font-size: 1.4rem; }
    main { padding: 1rem; }
    thead { display: none; }
    table, tbody, tr, td { display: block; width: 100%; }
    tbody tr { border: 1px solid var(--bg-secondary); border-left: 3px solid var(--sev); border-radius: 0.5rem; margin-bottom: 0.75rem; }
    tbody td { border: 0; padding: 0.3rem 0.8rem; }
    td.actions { text-align: left; padding-bottom: 0.7rem; }
    td.actions button { margin: 0.25rem 0.25rem 0 0; }
  }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg-primary); }
  ::-webkit-scrollbar-thumb { background: var(--bg-tertiary); border-radius: 3px; }
</style>
{{ portal_theme }}
</head>
<body>
<div class="header-bar">
  <div>
    <h1>HOMERUN²</h1>
    <div class="subtitle"><span class="header-service">sound catcher · </span>Announcement player</div>
  </div>
  <div class="badges" id="badges"></div>
</div>

<main>
  <div class="controls">
    <button id="unlock" class="primary">🔊 Enable sound</button>
    <label id="autoplay-label"><input type="checkbox" id="autoplay" checked> Play new announcements</label>
    <span class="spacer"></span>
    <button id="reset" title="Clear the list and collect from now on">New session</button>
  </div>
  <p class="notice" id="notice" hidden></p>

  <details id="control" hidden>
    <summary>Speaker control</summary>
    <div class="row">
      <input type="password" id="token" placeholder="API token" autocomplete="off">
      <button id="save-token">Save</button>
    </div>
    <div class="row">
      <span id="mute-state"></span>
      <button data-mute="15">Mute 15 min</button>
      <button data-mute="60">Mute 1 h</button>
      <button id="unmute">Unmute</button>
    </div>
  </details>

  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>Time ↓</th><th>Severity</th><th>System</th><th>Title</th><th>Status</th><th></th></tr>
      </thead>
      <tbody id="list"></tbody>
    </table>
  </div>
  <p class="empty" id="empty">Nothing in this session yet.</p>
  <p class="cap">Announcements since this session started, at most <span id="cap">–</span>.</p>
</main>

<div class="build-footer">
  <div><span class="label">version</span> <span class="value">{{ version }}</span></div>
  <div><span class="label">commit</span> <span class="value">{{ commit }}</span></div>
  <div><span class="label">built</span> <span class="value">{{ date }}</span></div>
  <div class="brand">
    <span class="label">a</span>
    <a href="https://github.com/stuttgart-things" target="_blank" rel="noopener">stuttgart-things</a>
    <span class="label">project</span>
    <img src="https://raw.githubusercontent.com/stuttgart-things/docs/main/hugo/sthings-logo.png" alt="sthings">
  </div>
</div>

<script>
(() => {
  "use strict";
  // URL prefix behind homerun2-portal (BASE_PATH), "" at the root. The audio
  // URLs in the history entries carry it already.
  const BASE_PATH = "{{ base_path }}";
  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { sessionStorage.setItem(k, v); } catch { /* private mode */ } },
  };

  let state = { sinks: [], speech: false, mutedUntil: null, historySize: 20, writable: false, speakerReplay: false };
  let entries = [];          // newest first, this session only, capped at historySize
  let unlocked = false;
  let playing = null;        // id of the entry playing in this browser
  const queue = [];          // ids waiting to play in this browser
  const audio = new Audio();
  let sessionStart = parseFloat(store.get("sessionStart") || "0");

  // ── playback in the browser ─────────────────────────────
  // Browsers only play audio after a user gesture; "Enable sound" is that
  // gesture. A short silent clip proves it worked.
  $("unlock").onclick = async () => {
    audio.src = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA=";
    try { await audio.play(); unlocked = true; } catch { unlocked = false; }
    renderBar();
  };
  $("autoplay").onchange = () => store.set("autoplay", $("autoplay").checked ? "1" : "0");
  if (store.get("autoplay") === "0") $("autoplay").checked = false;

  function enqueue(id) {
    if (playing === id || queue.includes(id)) return;
    queue.push(id);
    if (playing === null) next();
  }

  async function next() {
    const id = queue.shift();
    if (id === undefined) { playing = null; renderList(); return; }
    const entry = entries.find((e) => e.id === id);
    if (!entry || !entry.audio.length) { next(); return; }
    playing = id;
    renderList();
    for (const url of entry.audio) {
      try {
        audio.src = url;
        await audio.play();
        await new Promise((resolve) => { audio.onended = resolve; audio.onerror = resolve; });
      } catch {
        unlocked = false; renderBar();
        break;
      }
    }
    next();
  }

  // ── speaker control (token) ─────────────────────────────
  const token = () => store.get("token") || "";
  $("token").value = token();
  $("save-token").onclick = () => { store.set("token", $("token").value.trim()); renderList(); renderBar(); };

  async function write(method, path, body) {
    const res = await fetch(BASE_PATH + path, {
      method,
      headers: { "Authorization": "Bearer " + token(), "Content-Type": "application/json" },
      body: body ? JSON.stringify(body) : undefined,
    });
    if (!res.ok) {
      const msg = res.status === 401 ? "Wrong token" : res.status === 429 ? "Too many requests, wait a moment" : "Error " + res.status;
      notice(msg);
      throw new Error(msg);
    }
    notice("");
    return res.json();
  }
  document.querySelectorAll("[data-mute]").forEach((b) => {
    b.onclick = () => write("PUT", "/mute", { minutes: Number(b.dataset.mute) }).then(refreshState).catch(() => {});
  });
  $("unmute").onclick = () => write("DELETE", "/mute").then(refreshState).catch(() => {});

  function notice(text) { $("notice").textContent = text; $("notice").hidden = !text; }

  // ── session and history ─────────────────────────────────
  async function refreshState() {
    const res = await fetch(BASE_PATH + "/api/state");
    const s = await res.json();
    if (!sessionStart) { sessionStart = s.serverTime; store.set("sessionStart", String(sessionStart)); }
    applyState(s);
  }

  function applyState(s) {
    state = { ...state, ...s };
    renderBar();
    renderList();
  }

  async function loadHistory() {
    const res = await fetch(BASE_PATH + "/api/history?since=" + encodeURIComponent(sessionStart));
    entries = (await res.json()).slice(0, state.historySize);
    renderList();
  }

  $("reset").onclick = async () => {
    const res = await fetch(BASE_PATH + "/api/state");
    sessionStart = (await res.json()).serverTime;
    store.set("sessionStart", String(sessionStart));
    entries = []; queue.length = 0;
    renderList();
  };

  function onAnnouncement(entry) {
    if (entry.at < sessionStart || entries.some((e) => e.id === entry.id)) return;
    entries.unshift(entry);
    entries = entries.slice(0, state.historySize);
    renderList();
    maybeAutoplay(entry);
  }

  function maybeAutoplay(entry) {
    if (entry.autoplay && unlocked && $("autoplay").checked) enqueue(entry.id);
  }

  // What arrived while the stream was down still plays if it is this fresh.
  // Behind a gateway with a request timeout the stream drops every few
  // seconds; older than this, it is no longer news.
  const CATCH_UP_SECONDS = 60;
  let connectedOnce = false;

  function connect() {
    const source = new EventSource(BASE_PATH + "/api/events");
    source.addEventListener("state", (ev) => applyState(JSON.parse(ev.data)));
    source.addEventListener("announcement", (ev) => onAnnouncement(JSON.parse(ev.data)));
    // EventSource reconnects by itself; each (re)connect reloads the list.
    source.onopen = async () => {
      const seen = new Set(entries.map((e) => e.id));
      await loadHistory();
      if (connectedOnce) {
        const now = (await (await fetch(BASE_PATH + "/api/state")).json()).serverTime;
        entries
          .filter((e) => !seen.has(e.id) && now - e.at < CATCH_UP_SECONDS)
          .reverse()
          .forEach(maybeAutoplay);
      }
      connectedOnce = true;
    };
  }

  // ── rendering ───────────────────────────────────────────
  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function badge(label, value, cls) {
    const b = el("div", "badge " + (cls || ""));
    b.append(label + " ", el("strong", "", value));
    return b;
  }

  function renderBar() {
    const muted = state.mutedUntil ? new Date(state.mutedUntil) : null;
    const sinks = state.sinks.length ? state.sinks.join(" + ") : "none";
    const badges = [
      badge("Sinks:", sinks),
      badge("Speech:", state.speech ? "on" : "clips only", state.speech ? "" : "off"),
    ];
    if (muted) badges.push(badge("Muted until", muted.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }), "warn"));
    $("badges").replaceChildren(...badges);
    $("unlock").hidden = unlocked;
    $("autoplay-label").hidden = !state.sinks.includes("browser");
    $("control").hidden = !state.writable;
    $("mute-state").textContent = muted ? "Muted until " + muted.toLocaleTimeString() : "Not muted";
    $("cap").textContent = state.historySize;
  }

  function fmtTime(epoch) {
    return new Date(epoch * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }

  function sevVar(severity) {
    const s = (severity || "").toLowerCase();
    if (s === "error" || s === "critical") return "var(--severity-error)";
    if (["warning", "success", "debug"].includes(s)) return `var(--severity-${s})`;
    return "var(--severity-info)";
  }

  function renderList() {
    $("empty").hidden = entries.length > 0;
    $("list").replaceChildren(...entries.map((e) => {
      const tr = el("tr");
      tr.style.setProperty("--sev", sevVar(e.severity));
      if (e.id === playing) tr.classList.add("playing");
      if (e.outcome !== "played") tr.classList.add("quiet");

      const titleCell = el("td", "title-cell");
      titleCell.append(el("div", "title", e.title || "(no title)"));
      if (e.text) titleCell.append(el("div", "spoken", "“" + e.text + "”"));

      let status = e.outcomeText;
      if (e.origin === "replay") status += " · replayed";
      if (e.origin === "api") status += " · via API";

      const actions = el("td", "actions");
      const listen = el("button", "", e.id === playing ? "⏵ playing…" : "▶ Listen");
      listen.disabled = !e.audio.length || e.id === playing;
      listen.onclick = async () => { if (!unlocked) await $("unlock").onclick(); enqueue(e.id); };
      actions.append(listen);
      if (state.speakerReplay && token()) {
        const speaker = el("button", "", "🔊 Speaker");
        speaker.disabled = !e.audio.length;
        speaker.onclick = () => write("POST", `/api/history/${e.id}/replay`).catch(() => {});
        actions.append(speaker);
      }

      tr.append(
        el("td", "time", fmtTime(e.at)),
        el("td", "sev", e.severity),
        el("td", "system", e.system),
        titleCell,
        el("td", "status", status),
        actions,
      );
      return tr;
    }));
  }

  refreshState().then(connect);
})();
</script>
</body>
</html>
