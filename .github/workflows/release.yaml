---
name: Release
on:
  workflow_run:
    workflows: ["Build & Test"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: dagger-labda
    environment: k8s

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Get version before release
        id: version-before
        run: |
          git fetch --tags
          BEFORE=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || echo "none")
          echo "version=$BEFORE" >> $GITHUB_OUTPUT

      - name: Semantic release
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: "0.21.10"
          verb: call
          module: github.com/stuttgart-things/dagger/release@v0.86.0
          args: >-
            semantic
            --src .
            --token env:GITHUB_TOKEN
            --dry-run-only=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get new version
        id: version-after
        run: |
          git fetch --tags
          AFTER=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || echo "none")
          echo "version=$AFTER" >> $GITHUB_OUTPUT
          if [ "$AFTER" != "${{ steps.version-before.outputs.version }}" ] && [ "$AFTER" != "none" ]; then
            echo "new_release=true" >> $GITHUB_OUTPUT
            echo "New release: $AFTER"
          else
            echo "new_release=false" >> $GITHUB_OUTPUT
            echo "No new release"
          fi

      - name: Login to GHCR
        if: steps.version-after.outputs.new_release == 'true'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # amd64 for the LattePanda, arm64 so a Pi can run it too
      - name: Set up QEMU
        if: steps.version-after.outputs.new_release == 'true'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Buildx
        if: steps.version-after.outputs.new_release == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and push versioned image to GHCR (amd64 + arm64)
        if: steps.version-after.outputs.new_release == 'true'
        run: |
          VERSION="${{ steps.version-after.outputs.version }}"
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --build-arg VERSION=${VERSION} \
            --build-arg COMMIT=${{ github.sha }} \
            --build-arg DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
            -t ghcr.io/${{ github.repository }}:${VERSION} \
            -t ghcr.io/${{ github.repository }}:latest \
            --push \
            .


      - name: Update release notes
        if: steps.version-after.outputs.new_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version-after.outputs.version }}"
          EXISTING_BODY=$(gh release view "$VERSION" --json body --jq '.body')
          ARTIFACTS="### Artifacts\n\n| Artifact | Reference |\n|----------|-----------|"
          ARTIFACTS="${ARTIFACTS}\n| **Image** | \`ghcr.io/${{ github.repository }}:${VERSION}\` (linux/amd64, linux/arm64) |"
          gh release edit "$VERSION" --notes "$(printf '%s\n\n%b' "$EXISTING_BODY" "$ARTIFACTS")"

      - name: Release summary
        run: |
          if [ "${{ steps.version-after.outputs.new_release }}" == "true" ]; then
            VERSION="${{ steps.version-after.outputs.version }}"
            echo "## Release $VERSION" >> $GITHUB_STEP_SUMMARY
            echo "| Artifact | Reference |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-----------|" >> $GITHUB_STEP_SUMMARY
            echo "| **Image** | \`ghcr.io/${{ github.repository }}:$VERSION\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "## No Release" >> $GITHUB_STEP_SUMMARY
            echo "No new version created by semantic-release." >> $GITHUB_STEP_SUMMARY
          fi
